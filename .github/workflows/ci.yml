name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petcontrol-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petcontrol-next/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # O app ainda não tem script "test"; o passo passa a valer sozinho quando a fábrica criar um.
      - name: Testes (se o script test existir)
        run: npm run test --if-present
